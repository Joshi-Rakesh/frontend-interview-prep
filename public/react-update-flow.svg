<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
  <title id="title">React update flow</title>
  <desc id="description">State or props change, React renders elements, reconciles them, commits updates, and updates the DOM.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="900" height="180" rx="12" fill="#f8fafc" />
  <g font-family="Segoe UI, sans-serif" font-size="16" text-anchor="middle">
    <g fill="#fff" stroke="#94a3b8" stroke-width="2">
      <rect x="24" y="55" width="150" height="70" rx="8" />
      <rect x="204" y="55" width="150" height="70" rx="8" />
      <rect x="384" y="55" width="150" height="70" rx="8" />
      <rect x="564" y="55" width="150" height="70" rx="8" />
      <rect x="744" y="55" width="132" height="70" rx="8" />
    </g>
    <g fill="#0f172a" font-weight="600">
      <text x="99" y="96">State / props</text>
      <text x="279" y="96">Render</text>
      <text x="459" y="96">Reconcile</text>
      <text x="639" y="96">Commit</text>
      <text x="810" y="96">DOM</text>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M176 90h20" />
      <path d="M356 90h20" />
      <path d="M536 90h20" />
      <path d="M716 90h20" />
    </g>
  </g>
</svg>